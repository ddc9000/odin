<!doctype html>
<html lang="en" data-theme="forest-night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101411" />
    <meta
      name="description"
      content="ODIN is a read-only video site. Ambient forest pictures, and a stanza from the Hávamál."
    />
    <title>ODIN</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        background: #101411;
        color: #f4f0e6;
      }
    </style>
    <script>
      // GitHub Pages has no SPA fallback. public/404.html redirects here as
      // /odin/?/watch/id and this restores the real path before the app boots.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>ODIN needs JavaScript to play video.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
